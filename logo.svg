<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ywgf88 logo">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2c"/>
      <stop offset="0.55" stop-color="#08151f"/>
      <stop offset="1" stop-color="#050d15"/>
    </linearGradient>
    <radialGradient id="lg-halo" cx="256" cy="232" r="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#1f7ff0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg-mark" x1="186" y1="162" x2="326" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ef7e2"/>
      <stop offset="0.45" stop-color="#33c6ff"/>
      <stop offset="1" stop-color="#7b8dff"/>
    </linearGradient>
    <linearGradient id="lg-ring-a" x1="60" y1="40" x2="452" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35ecd6"/>
      <stop offset="0.6" stop-color="#3f8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3f8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lg-ring-b" x1="470" y1="64" x2="60" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ea2ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lg-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ef7e2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9df9ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#6ef7e2" stop-opacity="0"/>
    </linearGradient>
    <filter id="lg-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lg-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#lg-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="102" fill="none" stroke="#1a3550" stroke-width="2"/>

  <!-- 光晕 -->
  <circle cx="256" cy="232" r="236" fill="url(#lg-halo)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 外环旋转 -->
  <g>
    <circle cx="256" cy="240" r="198" fill="none" stroke="url(#lg-ring-a)" stroke-width="2.5" stroke-dasharray="26 16" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 256 240" to="360 256 240" dur="26s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 内环反向 -->
  <g>
    <circle cx="256" cy="240" r="172" fill="none" stroke="url(#lg-ring-b)" stroke-width="1.6" stroke-dasharray="4 12" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360 256 240" to="0 256 240" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 脉冲波 -->
  <circle cx="256" cy="240" r="60" fill="none" stroke="#5df3df" stroke-width="2" opacity="0">
    <animate attributeName="r" values="70;196" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="240" r="60" fill="none" stroke="#59a8ff" stroke-width="2" opacity="0">
    <animate attributeName="r" values="70;196" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 中心标识：由三条电路线构成的 Y -->
  <g filter="url(#lg-glow)">
    <path d="M 186 162 L 256 246 L 326 162" fill="none" stroke="url(#lg-mark)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 256 246 L 256 348" fill="none" stroke="url(#lg-mark)" stroke-width="15" stroke-linecap="round"/>
  </g>
  <!-- 沿线路流动的能量 -->
  <path d="M 186 162 L 256 246 L 326 162 M 256 246 L 256 348" fill="none" stroke="#d9fffa" stroke-width="4" stroke-linecap="round" opacity="0.9"
        stroke-dasharray="26 210">
    <animate attributeName="stroke-dashoffset" values="0;-236" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 端点节点 -->
  <g filter="url(#lg-soft)">
    <circle cx="186" cy="162" r="9" fill="#a6fff2">
      <animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="326" cy="162" r="9" fill="#a6fff2">
      <animate attributeName="r" values="8;11;8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="348" r="9" fill="#a6fff2">
      <animate attributeName="r" values="8;11;8" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 轨道卫星点 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 256 240" to="360 256 240" dur="14s" repeatCount="indefinite"/>
    <circle cx="256" cy="42" r="4.5" fill="#7ef4e4" opacity="0.95"/>
    <circle cx="256" cy="438" r="3.2" fill="#7f9dff" opacity="0.8"/>
  </g>

  <!-- 角落细線 -->
  <g opacity="0.5" stroke="#2a5f86" stroke-width="1.2">
    <line x1="88" y1="424" x2="128" y2="424"/>
    <line x1="88" y1="424" x2="88" y2="384"/>
    <line x1="424" y1="88" x2="384" y2="88"/>
    <line x1="424" y1="88" x2="424" y2="128"/>
  </g>
</svg>
