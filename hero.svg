<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="ywgf88 profile banner">
  <defs>
    <linearGradient id="hb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="0.5" stop-color="#071420"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="hb-glow1" cx="230" cy="210" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fd8c6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1fd8c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb-glow2" cx="1080" cy="60" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f6dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3f6dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hb-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#a9fff3"/>
      <stop offset="1" stop-color="#63d9ff"/>
    </linearGradient>
    <linearGradient id="hb-mark" x1="186" y1="162" x2="326" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ef7e2"/>
      <stop offset="0.45" stop-color="#33c6ff"/>
      <stop offset="1" stop-color="#7b8dff"/>
    </linearGradient>
    <linearGradient id="hb-line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2ee6d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hb-line2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b8cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4b8cff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4b8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hb-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff6e6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b9fff5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ff6e6" stop-opacity="0"/>
    </linearGradient>
    <filter id="hb-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12" result="hb1"/>
      <feMerge>
        <feMergeNode in="hb1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="hb-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2b5470" opacity="0.55"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1280" height="420" fill="url(#hb-bg)"/>
  <rect x="0" y="0" width="1280" height="420" fill="url(#hb-dots)"/>
  <rect x="0" y="0" width="1280" height="420" fill="url(#hb-glow1)"/>
  <rect x="0" y="0" width="1280" height="420" fill="url(#hb-glow2)"/>

  <!-- 背景数据流 -->
  <g opacity="0.55">
    <path d="M 0 342 C 260 300 380 400 640 352 C 900 306 1030 386 1280 336" fill="none" stroke="url(#hb-line1)" stroke-width="2.5" stroke-dasharray="18 26">
      <animate attributeName="stroke-dashoffset" values="0;-440" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 384 C 300 344 520 424 780 380 C 1010 342 1140 400 1280 372" fill="none" stroke="url(#hb-line2)" stroke-width="1.8" stroke-dasharray="10 30">
      <animate attributeName="stroke-dashoffset" values="0;400" dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 60 C 300 20 620 96 900 52 C 1080 26 1180 62 1280 44" fill="none" stroke="url(#hb-line1)" stroke-width="1.6" opacity="0.5" stroke-dasharray="12 34">
      <animate attributeName="stroke-dashoffset" values="0;-480" dur="16s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右侧电路装饰 -->
  <g opacity="0.4" stroke="#2f6f96" stroke-width="1.4" fill="none">
    <path d="M 1010 132 H 1096 L 1132 168 H 1224"/>
    <path d="M 1050 236 H 1120 L 1156 272 H 1250"/>
    <circle cx="1010" cy="132" r="3" fill="#63e6d4" stroke="none"/>
    <circle cx="1250" cy="272" r="3" fill="#6f9dff" stroke="none"/>
  </g>

  <!-- 左侧 logo -->
  <g transform="translate(108 92) scale(0.46)">
    <rect x="0" y="0" width="512" height="512" rx="104" fill="#0b1826"/>
    <rect x="2" y="2" width="508" height="508" rx="102" fill="none" stroke="#1d3c58" stroke-width="2"/>
    <g>
      <circle cx="256" cy="240" r="198" fill="none" stroke="#35ecd6" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="26 16">
        <animateTransform attributeName="transform" type="rotate" from="0 256 240" to="360 256 240" dur="24s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="256" cy="240" r="170" fill="none" stroke="#8ea2ff" stroke-opacity="0.3" stroke-width="1.6" stroke-dasharray="4 14">
        <animateTransform attributeName="transform" type="rotate" from="360 256 240" to="0 256 240" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="256" cy="240" r="60" fill="none" stroke="#5df3df" stroke-width="2" opacity="0">
      <animate attributeName="r" values="70;196" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <g filter="url(#hb-glow)">
      <path d="M 186 162 L 256 246 L 326 162" fill="none" stroke="url(#hb-mark)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 256 246 L 256 348" fill="none" stroke="url(#hb-mark)" stroke-width="15" stroke-linecap="round"/>
    </g>
    <path d="M 186 162 L 256 246 L 326 162 M 256 246 L 256 348" fill="none" stroke="#e6fffb" stroke-width="4" stroke-linecap="round" stroke-dasharray="24 200">
      <animate attributeName="stroke-dashoffset" values="0;-224" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="186" cy="162" r="9" fill="#a6fff2">
      <animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="326" cy="162" r="9" fill="#a6fff2">
      <animate attributeName="r" values="8;11;8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="348" r="9" fill="#a6fff2">
      <animate attributeName="r" values="8;11;8" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 文字 -->
  <text x="376" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="3" fill="url(#hb-name)">ywgf88</text>
  <rect x="378" y="204" width="86" height="2" fill="#35ecd6" opacity="0.9">
    <animate attributeName="width" values="86;230;86" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="378" y="252" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="24" fill="#c8dcea" letter-spacing="1.5">工程管理 · 网络折腾爱好者</text>
  <text x="378" y="294" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="18" fill="#7d9fb6" letter-spacing="0.5">OpenWrt / ImmortalWrt 云编译 · 软路由 · Docker · 自动化</text>
  <text x="378" y="326" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#5c7a90" letter-spacing="1">Wuhan, China · GitHub since 2018</text>

  <!-- 底部扫光 -->
  <rect x="0" y="416" width="1280" height="3" fill="#16324a"/>
  <rect x="-260" y="416" width="260" height="3" fill="url(#hb-sweep)">
    <animate attributeName="x" values="-260;1280" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="0" width="1280" height="420" fill="none" stroke="#16324a" stroke-width="2"/>
</svg>
