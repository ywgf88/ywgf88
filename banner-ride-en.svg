<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="ywgf88 profile banner, English">
  <defs>
    <linearGradient id="hb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="0.5" stop-color="#071420"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="hb-glow1" cx="230" cy="220" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fd8c6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1fd8c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb-dawn" cx="1180" cy="352" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb469" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ff9a4d" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hb-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#b6fff4"/>
      <stop offset="1" stop-color="#5cd6ff"/>
    </linearGradient>
    <linearGradient id="hb-mark" x1="186" y1="162" x2="326" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ef7e2"/>
      <stop offset="0.45" stop-color="#33c6ff"/>
      <stop offset="1" stop-color="#7b8dff"/>
    </linearGradient>
    <linearGradient id="hb-line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2ee6d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hb-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff6e6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b9fff5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ff6e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hb-path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ff0dc" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#8ff8ea" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffc98a" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="hb-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12" result="hb1"/>
      <feMerge>
        <feMergeNode in="hb1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hb-neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="hb2"/>
      <feMerge>
        <feMergeNode in="hb2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="hb-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2b5470" opacity="0.55"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1280" height="440" fill="url(#hb-bg)"/>
  <rect x="0" y="0" width="1280" height="440" fill="url(#hb-dots)"/>
  <rect x="0" y="0" width="1280" height="440" fill="url(#hb-glow1)"/>
  <rect x="0" y="0" width="1280" height="440" fill="url(#hb-dawn)"/>

  <g opacity="0.5">
    <path d="M 0 372 C 260 330 380 430 640 382 C 900 336 1030 416 1280 366" fill="none" stroke="url(#hb-line1)" stroke-width="2.5" stroke-dasharray="18 26">
      <animate attributeName="stroke-dashoffset" values="0;-440" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 412 C 300 372 520 452 780 408 C 1010 370 1140 428 1280 400" fill="none" stroke="url(#hb-line1)" stroke-width="1.4" opacity="0.5" stroke-dasharray="10 30">
      <animate attributeName="stroke-dashoffset" values="0;400" dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 62 C 300 22 620 98 900 54 C 1080 28 1180 64 1280 46" fill="none" stroke="url(#hb-line1)" stroke-width="1.6" opacity="0.5" stroke-dasharray="12 34">
      <animate attributeName="stroke-dashoffset" values="0;-480" dur="16s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 绿道：一条向远处延伸的路 -->
  <g opacity="0.85">
    <path d="M 950 402 C 1050 366 1150 372 1276 330" fill="none" stroke="url(#hb-path)" stroke-width="2.4"/>
    <path d="M 950 390 C 1050 354 1150 360 1276 318" fill="none" stroke="url(#hb-path)" stroke-width="1.4" opacity="0.6"/>
    <path d="M 950 396 C 1050 360 1150 366 1276 324" fill="none" stroke="#eafffb" stroke-width="2" stroke-dasharray="14 60" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-370" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>


  <!-- 路灯 -->
  <g opacity="0.9">
    <line x1="968" y1="386" x2="968" y2="322" stroke="#2f6f96" stroke-width="2"/>
    <circle cx="968" cy="320" r="3.4" fill="#ffe0a8"/>
    <circle cx="968" cy="320" r="16" fill="#ffc27a" opacity="0.22">
      <animate attributeName="opacity" values="0.16;0.3;0.16" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 骑行剪影 -->
  <g filter="url(#hb-neon)" opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.2s" repeatCount="indefinite"/>
    <circle cx="1146" cy="352" r="12" fill="none" stroke="#7ff6e6" stroke-width="2"/>
    <circle cx="1200" cy="352" r="12" fill="none" stroke="#7ff6e6" stroke-width="2"/>
    <path d="M 1146 352 L 1164 328 L 1192 328 L 1200 352 M 1164 328 L 1174 352" fill="none" stroke="#7ff6e6" stroke-width="2"/>
    <path d="M 1192 328 L 1200 318 L 1208 314" fill="none" stroke="#7ff6e6" stroke-width="2"/>
    <path d="M 1164 328 L 1156 316 L 1150 314" fill="none" stroke="#7ff6e6" stroke-width="1.6"/>
    <circle cx="1168" cy="298" r="8.5" fill="#0b1b2b" stroke="#ffe0c2" stroke-width="2"/>
    <path d="M 1168 306 L 1174 326 L 1168 340 L 1158 350" fill="none" stroke="#ffe0c2" stroke-width="2" stroke-linecap="round"/>
    <path d="M 1172 314 L 1194 320" fill="none" stroke="#ffe0c2" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 1164 322 L 1152 334 L 1148 350" fill="none" stroke="#ffe0c2" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 左侧动态标识 -->
  <g transform="translate(96 92) scale(0.5)">
    <rect x="0" y="0" width="512" height="512" rx="104" fill="#0b1826"/>
    <rect x="2" y="2" width="508" height="508" rx="102" fill="none" stroke="#1d3c58" stroke-width="2"/>
    <g>
      <circle cx="256" cy="240" r="198" fill="none" stroke="#35ecd6" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="26 16">
        <animateTransform attributeName="transform" type="rotate" from="0 256 240" to="360 256 240" dur="24s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="256" cy="240" r="170" fill="none" stroke="#8ea2ff" stroke-opacity="0.28" stroke-width="1.6" stroke-dasharray="4 14">
        <animateTransform attributeName="transform" type="rotate" from="360 256 240" to="0 256 240" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="256" cy="240" r="60" fill="none" stroke="#5df3df" stroke-width="2" opacity="0">
      <animate attributeName="r" values="70;196" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <g filter="url(#hb-glow)">
      <path d="M 186 162 L 256 246 L 326 162" fill="none" stroke="url(#hb-mark)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 256 246 L 256 348" fill="none" stroke="url(#hb-mark)" stroke-width="15" stroke-linecap="round"/>
    </g>
    <path d="M 186 162 L 256 246 L 326 162 M 256 246 L 256 348" fill="none" stroke="#e6fffb" stroke-width="4" stroke-linecap="round" stroke-dasharray="24 200">
      <animate attributeName="stroke-dashoffset" values="0;-224" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="186" cy="162" r="9" fill="#a6fff2">
      <animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="326" cy="162" r="9" fill="#a6fff2">
      <animate attributeName="r" values="8;11;8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="348" r="9" fill="#a6fff2">
      <animate attributeName="r" values="8;11;8" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 文字 -->
  <text x="398" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="98" font-weight="700" letter-spacing="4" fill="url(#hb-name)">ywgf88</text>
  <text x="400" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="37" font-weight="600" fill="#cfdfec" letter-spacing="0.8">Ride by day · Flash by night</text>
  <rect x="402" y="300" width="320" height="2.5" fill="#35ecd6" opacity="0.85">
    <animate attributeName="width" values="320;640;320" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="402" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#6f8ea4" letter-spacing="1.2">OpenWrt builds · Soft router · Docker · Wuhan, China</text>

  <rect x="0" y="434" width="1280" height="4" fill="#16324a"/>
  <rect x="-260" y="434" width="260" height="4" fill="url(#hb-sweep)">
    <animate attributeName="x" values="-260;1280" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="0" width="1280" height="440" fill="none" stroke="#16324a" stroke-width="2"/>
</svg>